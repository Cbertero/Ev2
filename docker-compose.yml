version: '3.9'

services:

  productos:
    build:
      context: ./productos
    container_name: productos
    ports:
      - "8080:8080"
    networks:
      - microservicios-net
    restart: unless-stopped

  productosbd:
    build:
      context: ./productosbd
    container_name: productosbd
    ports:
      - "8081:8081"
    environment:
      AUTH_BASE_URL: http://productos:8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/mibd
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: admin123
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - microservicios-net
    restart: unless-stopped

  postgres-db:
    image: postgres:16-alpine
    container_name: postgres-db
    environment:
      POSTGRES_DB: mibd
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d mibd"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - microservicios-net

networks:
  microservicios-net:
    driver: bridge

volumes:
  postgres-data: